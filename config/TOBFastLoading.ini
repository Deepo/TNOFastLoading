; Wolfenstein The Old Blood - Fast Loading: settings.
; true = on, false = off (the game's own behaviour). A missing file or line means true.
; Read once at start-up: restart the game after a change.

[Loading]
; Stream reads check right away whether they have finished, instead of sleeping 1-2 ms each.
; The main fix: these sleeps are most of the time a save or a chapter takes to load.
FastReads = true

; With FastReads: each read is checked continuously for up to 2 ms, then the game sleeps as it
; always did, so a slow hard drive doesn't keep a CPU core busy. No difference on SSDs.
SmartWait = true

; The texture preload after each map load is checked every 1 ms instead of every 100 ms.
FastPreloadWait = true

[LoadScreen]
; No "press to continue" after a load. Story cutscenes that play while a chapter loads are
; left alone: they play, and can be skipped, as usual.
AutoContinue = true

[Startup]
; No logo video at start-up (~30 s).
SkipIntroVideo = true

; No photosensitivity warning and auto-save notice before the main menu. The same as the launch
; option +skipInitialWarningScreens 1.
SkipWarningScreens = true

[Quit]
; Quit to Desktop closes the game without first clearing its texture caches one page at a time
; (about 1 s; about 10 s if the cache sizes have been raised in graphicsprofiles.json).
FastQuit = true
