; Wolfenstein The New Order - Fast Loading: settings.
; true = on, false = off (the game's own behaviour). A missing file or line means true.
; Read once at start-up: restart the game after a change.

[Loading]
; Stream reads check right away whether they have finished, instead of sleeping 1-2 ms each.
; The main fix: these sleeps are most of the ~10 s a save takes to load.
FastReads = true

; With FastReads: each read is checked continuously for up to 2 ms, then the game sleeps as it
; always did, so a slow hard drive doesn't keep a CPU core busy. No difference on SSDs.
SmartWait = true

; The texture preload after each map load is checked every 1 ms instead of every 100 ms.
FastPreloadWait = true

[LoadScreen]
; No "press X to continue" after a load. Story cutscenes that play while a chapter loads are
; left alone: they play, and can be skipped, as usual.
AutoContinue = true

[Startup]
; No logo video at start-up (~30 s), the same as the launch option +com_skipIntroVideo 1.
SkipIntroVideo = true
